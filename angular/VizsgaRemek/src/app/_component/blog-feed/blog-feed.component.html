<section class="container py-5">
    <div class="blog-container">
        <br>
        <div class="toolbar">
            <input type="text" placeholder="Search between posts..." [(ngModel)]="searchTerm" class="search-input" />
            <select [(ngModel)]="sortOrder" class="sort-select">
                <option value="latest">Latest in front</option>
                <option value="oldest">Oldest in the front</option>
                <option value="mostComments">Most commented</option>
            </select>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-12" *ngFor="let post of filteredAndSortedPosts">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <strong>{{ post.author }}</strong>
                            <small class="text-muted ms-2">{{ post.createdAt | date: 'medium' }}</small>
                        </div>
                        <button *ngIf="post.authorId === currentUserId" class="btn btn-sm btn-outline-danger"
                            (click)="deletpost(post.blogId)">🗑️</button>

                    </div>

                    <div *ngIf="post.comments?.length === 0" class="text-muted">No comments yet.</div>
                    <h5 class="card-title" *ngIf="!post.editing">{{ post.title }}</h5>
                    <h5 class="card-title" *ngIf="post.editing"><input type="text" [(ngModel)]="post.title"
                            class="form-control" /></h5>
                    <p class="card-text" *ngIf="!post.editing">{{ post.content }}</p>
                    <textarea *ngIf="post.editing" [(ngModel)]="post.content" class="form-control mb-2"></textarea>
                    <img *ngIf="post.imageUrl" [src]="post.imagesUrl" alt="Post image" class="img-fluid rounded mb-3" />
                    <label *ngIf="post.editing" class="form-label">Kép</label>
                    <input *ngIf="post.editing" type="file" (change)="onFileSelected($event, post)" class="form-control mb-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <button class="btn btn-sm btn-outline-primary me-2" (click)="likePost(post.blogId)">
                                👍 {{ post.likesCount || 0 }}
                            </button>
                            <button *ngIf="post.authorId === currentUserId" class="btn btn-sm btn-outline-secondary"
                                (click)="post.editing ? saveEdit(post) : toggleEditPost(post)">
                                {{ post.editing ? '💾 Save' : '✏️ Edit' }}
                            </button>


                        </div>
                    </div>
                    <div class="mt-4">
                        <textarea [(ngModel)]="commentInputs[post.blogId]" placeholder="💬 Write a comment..."
                            class="form-control mb-2"></textarea>
                        <button class="btn btn-sm btn-dark" (click)="addComment(post.blogId)">Send</button>
                    </div>
                    <div *ngFor="let comment of post.comments" class="mt-3 p-3 bg-light rounded">
                        <div class="d-flex justify-content-between">
                            <div>
                                <strong>{{ comment.commenter }}</strong>:
                                <span *ngIf="!isEdit">{{ comment.commentText }}</span>
                                <textarea *ngIf="isEdit" [(ngModel)]="comment.commentText"
                                    class="form-control"></textarea>
                            </div>
                            <div class="text-end">
                                <button class="btn btn-sm btn-outline-warning me-1" (click)="toggleEditComment(comment)"
                                    *ngIf="post.authorId === currentUserId">✏️</button>
                                <button class="btn btn-sm btn-outline-danger"
                                    (click)="deleteComment(post.blogId, comment.commentId)"
                                    *ngIf="post.authorId === currentUserId">
                                    🗑️
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="showToast" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div class="toast show text-white {{ toastColorClass }} border-0 shadow">
            <div class="d-flex">
                <div class="toast-body">
                    {{ toastMessage }}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    (click)="showToast = false"></button>
            </div>
        </div>
    </div>

</section>
