<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f0f2f5; font-family: Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td style="padding: 30px 15px;">
        <table width="600" cellpadding="0" cellspacing="0"
          style="border-radius: 8px; overflow: hidden; max-width: 600px; width: 100%;">

          <!-- Header Image -->
          <tr>
            <td
              style="background-image: url('https://raw.githubusercontent.com/MartinGal2003/imageForEmail/refs/heads/main/placeholder.webp'); background-size: cover; background-position: center; height: 200px; text-align: center;">
              <div style="padding-top: 40px;">
                <img src="https://raw.githubusercontent.com/MartinGal2003/imageForEmail/refs/heads/main/retro_logo.png"
                  alt="Logo" width="120" style="display: block; margin: 0 auto 10px;" />
                <h2 style="color: #ffffff; margin: 0; font-size: 20px; text-transform: uppercase;">Retro Vintage Shop
                </h2>
              </div>
            </td>
          </tr>

          <!-- Content Section -->
          <tr>
            <td style="padding: 30px; background-color: #ffffff;">
              <h2 style="margin-top: 0; color: #333;">Hello, {{name}}! 🎉</h2>
              <p style="font-size: 16px; color: #444;">
                {{mainContent}}
              </p>
              <p style="font-size: 16px; color: #444;">
                {{content}}
              </p>
              <p style="font-size: 16px; color: #444;">
                {{otherContent}}
              </p>
              <p style="font-size: 16px; color: #444;">Best regards, <strong>Retro Vintage</strong></p>

              <!-- CTA Button -->
              <p style="text-align: center; margin-top: 30px;">
                <a href="{{homelink}}"
                  style="display: inline-block; padding: 12px 24px; background-color: #28a745; color: #ffffff; text-decoration: none; border-radius: 5px; font-size: 16px;">
                  Go to Home page
                </a>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #e9ecef; text-align: center; padding: 20px; font-size: 14px; color: #777;">
              <span style="font-size: 13px; color: #999999; margin-top: 30px; text-align: center;">If you change your
                mind, you can <a href="http://localhost:4200/unsubscribe">unsubscribe here</a>!</span>
              <br>
              <br>
              <br>
              &copy; {{currentYear}} Retro Vintage Shop. All rights reserved.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>

</html>
